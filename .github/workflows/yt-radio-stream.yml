name: Viru Radio 24/7 YT Stream (Final Audio Fixed)

on:
  workflow_dispatch:

  schedule:
    - cron: '0 */5 * * *' # පැය 5න් 5ට auto restart වෙනවා

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. INSTALL SYSTEM DEPENDENCIES
      # ============================================================
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            pulseaudio \
            pulseaudio-utils \
            ffmpeg \
            chromium-browser \
            alsa-utils \
            libasound2-plugins


      # ============================================================
      # 2. NODE.JS
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'


      # ============================================================
      # 3. PUPPETEER
      # ============================================================
      - name: Install Puppeteer
        run: |
          npm install puppeteer


      # ============================================================
      # 4. YOUR ORIGINAL BUTTON CLICK SCRIPT
      #    NOTHING CHANGED HERE
      # ============================================================
      - name: Create Smart Red Button Clicker Script (Untouched)
        run: |
          cat << 'EOF' > stream.js
          const puppeteer = require('puppeteer');
          
          (async () => {
            const browser = await puppeteer.launch({
              headless: false,
              defaultViewport: { width: 1280, height: 720 },
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--autoplay-policy=no-user-gesture-required',
                '--window-size=1280,720',
                '--start-maximized'
              ]
            });
            const page = await browser.newPage();
            
            console.log("Loading Viru Radio website...");
            await page.goto('https://viru-radio.pages.dev/', { waitUntil: 'networkidle2' });
            
            try {
              await page.waitForFunction(() => {
                const elements = [...document.querySelectorAll('*')];
                return elements.some(el => {
                  const textMatch = el.innerText && el.innerText.includes('Listen Live');
                  const bg = window.getComputedStyle(el).backgroundColor;
                  const isRed = bg.includes('rgb(255,') || bg.includes('rgb(239,') || bg.includes('red');
                  return textMatch || isRed;
                });
              }, { timeout: 60000 });
              
              const buttonHandle = await page.evaluateHandle(() => {
                const elements = [...document.querySelectorAll('*')];
                return elements.reverse().find(el => {
                  const text = el.innerText || '';
                  const bg = window.getComputedStyle(el).backgroundColor;
                  const isRed = bg.includes('rgb(255,') || bg.includes('rgb(239,') || bg.includes('red');
                  return (text.includes('Listen Live') && text.length < 20) || (isRed && text.includes('Listen'));
                });
              });
              
              const box = await buttonHandle.boundingBox();
              if (box) {
                const targetX = box.x + box.width / 2;
                const targetY = box.y + box.height / 2;
                await page.mouse.move(targetX, targetY, { steps: 10 });
                await page.mouse.down();
                await new Promise(r => setTimeout(r, 150)); 
                await page.mouse.up();
                console.log("Red Button Clicked successfully!");
              } else {
                await buttonHandle.evaluate(b => b.click());
              }
            } catch (err) {
              console.log("Error during click process:", err);
            }
          })();
          EOF


      # ============================================================
      # 5. START PULSEAUDIO + BROWSER + FFMPEG
      # ============================================================
      - name: Start Stream to YouTube
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}

        run: |

          set -e

          echo "=========================================="
          echo " VIRU RADIO STREAM STARTING"
          echo "=========================================="


          # ========================================================
          # 1. ALSA -> PULSEAUDIO
          # ========================================================

          cat > ~/.asoundrc <<'EOF'
          pcm.!default {
              type pulse
          }

          ctl.!default {
              type pulse
          }
          EOF

          echo "ALSA -> PulseAudio bridge configured."


          # ========================================================
          # 2. START PULSEAUDIO
          # ========================================================

          pulseaudio -D --exit-idle-time=-1

          sleep 3

          echo "PulseAudio started."


          # ========================================================
          # 3. CREATE VIRTUAL AUDIO SINK
          # ========================================================

          pactl load-module module-null-sink \
            sink_name=v1 \
            sink_properties=device.description=ViruRadioSink

          sleep 2


          # ========================================================
          # 4. MAKE v1 DEFAULT
          # ========================================================

          pactl set-default-sink v1
          pactl set-default-source v1.monitor


          # ========================================================
          # 5. FORCE DEFAULT AUDIO ENVIRONMENT
          # ========================================================

          export PULSE_SINK=v1

          echo "PULSE_SINK = $PULSE_SINK"


          # ========================================================
          # 6. SHOW AUDIO DEVICES
          # ========================================================

          echo ""
          echo "========== PULSEAUDIO SINKS =========="

          pactl list short sinks

          echo ""
          echo "========== PULSEAUDIO SOURCES =========="

          pactl list short sources


          # ========================================================
          # 7. START Xvfb
          # ========================================================

          export DISPLAY=:99

          Xvfb :99 \
            -screen 0 1280x720x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset &

          sleep 3

          echo "Xvfb started."


          # ========================================================
          # 8. START YOUR ORIGINAL BROWSER SCRIPT
          # ========================================================

          export PULSE_SINK=v1
          export DISPLAY=:99

          node stream.js > browser.log 2>&1 &

          BROWSER_PID=$!

          echo "Browser PID: $BROWSER_PID"


          # ========================================================
          # 9. WAIT FOR WEBSITE + BUTTON + RADIO
          # ========================================================

          echo ""
          echo "Waiting for browser/radio..."

          sleep 15


          # ========================================================
          # 10. SHOW BROWSER LOG
          # ========================================================

          echo ""
          echo "========== BROWSER LOG =========="

          cat browser.log || true


          # ========================================================
          # 11. CRITICAL AUDIO FIX
          #
          # Chromium may create its audio stream on another sink.
          # Find every sink-input and move it to v1.
          # ========================================================

          echo ""
          echo "========== MOVING CHROME AUDIO TO v1 =========="

          for i in $(seq 1 30); do

            echo "Audio routing attempt $i/30"

            INPUTS=$(pactl list short sink-inputs | awk '{print $1}')

            if [ -n "$INPUTS" ]; then

              for INPUT in $INPUTS; do

                echo "Moving sink-input $INPUT -> v1"

                pactl move-sink-input "$INPUT" v1 || true

              done

              echo "Chrome audio input detected."

            else

              echo "No sink-input detected yet."

            fi

            sleep 1

          done


          # ========================================================
          # 12. FINAL AUDIO CHECK
          # ========================================================

          echo ""
          echo "========== FINAL SINK INPUTS =========="

          pactl list short sink-inputs || true


          echo ""
          echo "========== DEFAULT SINK =========="

          pactl get-default-sink || true


          echo ""
          echo "========== DEFAULT SOURCE =========="

          pactl get-default-source || true


          # ========================================================
          # 13. CHECK YOUTUBE KEY
          # ========================================================

          if [ -z "$YOUTUBE_STREAM_KEY" ]; then
            echo "ERROR: YOUTUBE_STREAM_KEY is empty!"
            exit 1
          fi


          # ========================================================
          # 14. START FFMPEG
          #
          # VIDEO  -> Xvfb
          # AUDIO  -> v1.monitor
          # ========================================================

          echo ""
          echo "=========================================="
          echo " STARTING FFMPEG"
          echo " VIDEO : X11 :99"
          echo " AUDIO : PulseAudio v1.monitor"
          echo "=========================================="
          echo ""

          ffmpeg \
            -hide_banner \
            -loglevel info \
            -thread_queue_size 2048 \
            -f x11grab \
            -video_size 1280x720 \
            -framerate 30 \
            -i :99 \
            -thread_queue_size 2048 \
            -f pulse \
            -i v1.monitor \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v libx264 \
            -preset veryfast \
            -b:v 2500k \
            -maxrate 2500k \
            -bufsize 5000k \
            -pix_fmt yuv420p \
            -g 60 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/$YOUTUBE_STREAM_KEY"
