name: Viru Radio 24/7 YT Stream (Final Audio Fixed)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *' # පැය 5න් 5ට auto restart වෙනවා

jobs:
  stream:
    runs-on: ubuntu-latest
    
    steps:
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb pulseaudio ffmpeg chromium-browser alsa-utils libasound2-plugins

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Create Smart Red Button Clicker Script (Untouched)
        run: |
          cat << 'EOF' > stream.js
          const puppeteer = require('puppeteer');
          
          (async () => {
            const browser = await puppeteer.launch({
              headless: false,
              defaultViewport: { width: 1280, height: 720 },
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--autoplay-policy=no-user-gesture-required',
                '--window-size=1280,720',
                '--start-maximized'
              ]
            });
            const page = await browser.newPage();
            
            console.log("Loading Viru Radio website...");
            await page.goto('https://viru-radio.pages.dev/', { waitUntil: 'networkidle2' });
            
            try {
              await page.waitForFunction(() => {
                const elements = [...document.querySelectorAll('*')];
                return elements.some(el => {
                  const textMatch = el.innerText && el.innerText.includes('Listen Live');
                  const bg = window.getComputedStyle(el).backgroundColor;
                  const isRed = bg.includes('rgb(255,') || bg.includes('rgb(239,') || bg.includes('red');
                  return textMatch || isRed;
                });
              }, { timeout: 60000 });
              
              const buttonHandle = await page.evaluateHandle(() => {
                const elements = [...document.querySelectorAll('*')];
                return elements.reverse().find(el => {
                  const text = el.innerText || '';
                  const bg = window.getComputedStyle(el).backgroundColor;
                  const isRed = bg.includes('rgb(255,') || bg.includes('rgb(239,') || bg.includes('red');
                  return (text.includes('Listen Live') && text.length < 20) || (isRed && text.includes('Listen'));
                });
              });
              
              const box = await buttonHandle.boundingBox();
              if (box) {
                const targetX = box.x + box.width / 2;
                const targetY = box.y + box.height / 2;
                await page.mouse.move(targetX, targetY, { steps: 10 });
                await page.mouse.down();
                await new Promise(r => setTimeout(r, 150)); 
                await page.mouse.up();
                console.log("Red Button Clicked successfully!");
              } else {
                await buttonHandle.evaluate(b => b.click());
              }
            } catch (err) {
              console.log("Error during click process:", err);
            }
          })();
          EOF

      - name: Start Stream to YouTube
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          # 1. ALSA to PulseAudio bridge config එක හැදීම
          echo -e "pcm.!default {\n    type pulse\n}\nctl.!default {\n    type pulse\n}" > ~/.asoundrc
          
          # 2. PulseAudio System එක Start කර sink/source setup කිරීම
          pulseaudio -D --exit-idle-time=-1
          sleep 2
          
          pacmd load-module module-virtual-sink sink_name=v1
          pacmd set-default-sink v1
          pacmd set-default-source v1.monitor
          
          # 3. CRITICAL: Chromium audio output එක v1 sink එකටම force කිරීම
          export PULSE_SINK=v1
          
          # 4. Virtual Display එක Start කිරීම
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 3

          # 5. Browser Script එක Run කර Button එක click කරවීම
          node stream.js &
          
          # 6. Radio එක play වී audio load වීමට තත්පර 15ක් ඉඳීම
          sleep 15 

          # 7. Audio sinks connect වී ඇත්දැයි බැලීමට debug logs පෙන්වීම
          echo "=== PulseAudio Sink Inputs ==="
          pactl list short sink-inputs || true

          # 8. FFmpeg හරහා screen එකයි v1.monitor audio එකයි capture කර YouTube යැවීම
          ffmpeg -thread_queue_size 1024 \
          -f x11grab -video_size 1280x720 -framerate 30 -i :99 \
          -f pulse -i v1.monitor \
          -c:v libx264 -preset veryfast -b:v 2500k -maxrate 2500k -bufsize 5000k -pix_fmt yuv420p -g 60 \
          -c:a aac -b:a 128k -ar 44100 \
          -f flv "rtmp://a.rtmp.youtube.com/live2/$YOUTUBE_STREAM_KEY"
