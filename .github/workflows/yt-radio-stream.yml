name: Viru Radio YT Stream (Browser Capture)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *' # Paya 5n 5ta auto restart wenawa

jobs:
  stream:
    runs-on: ubuntu-latest
    
    steps:
      - name: Install System Dependencies (Video/Audio)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb pulseaudio ffmpeg chromium-browser

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Create Auto-Clicker Script (Whole Page)
        run: |
          cat << 'EOF' > stream.js
          const puppeteer = require('puppeteer');
          
          (async () => {
            const browser = await puppeteer.launch({
              headless: false,
              defaultViewport: { width: 1280, height: 720 },
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--autoplay-policy=no-user-gesture-required',
                '--window-size=1280,720',
                '--start-maximized'
              ]
            });
            const page = await browser.newPage();
            
            console.log("Loading website...");
            await page.goto('https://viru-radio.pages.dev/', { waitUntil: 'networkidle2' });
            
            // Radio eka load wenakam titha 5-10k innawa
            console.log("Waiting 10 seconds for initial connection...");
            await new Promise(r => setTimeout(r, 10000));
            
            console.log("Clicking *everywhere* on the page...");
            
            // Whole page area (1280x720) clicks yawanna:
            await page.evaluate(() => {
              const width = 1280;
              const height = 720;
              const stepX = 50; // Every 50 pixels horizontally
              const stepY = 50; // Every 50 pixels vertically
              
              for (let x = 0; x < width; x += stepX) {
                for (let y = 0; y < height; y += stepY) {
                  // Coordinate ekak generate karala math click yawanna
                  const clickX = x + Math.random() * 20; // Random offset for variation
                  const clickY = y + Math.random() * 20;
                  
                  // Meke simulate karanna custom function ekak liwwa
                  window.dispatchEvent(new MouseEvent('click', {
                    view: window,
                    bubbles: true,
                    cancelable: true,
                    clientX: clickX,
                    clientY: clickY
                  }));
                }
              }
            });
            
            console.log("Radio playing. Keeping browser open...");
          })();
          EOF

      - name: Start Stream to YouTube
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          # Virtual Audio System ekon kirima
          pulseaudio -D --exit-idle-time=-1
          pacmd load-module module-virtual-sink sink_name=v1
          
          # Virtual Display ekon kirima
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 3

          # Node script eka run karala website eka open kirima
          node stream.js &
          
          # Whole page click wenakota stream eka patan ganna
          sleep 5 

          # Screen ekai Audio ekai record karala YouTube yaweema
          ffmpeg -thread_queue_size 1024 -f x11grab -video_size 1280x720 -framerate 30 -i :99 \
          -f pulse -i default \
          -c:v libx264 -preset veryfast -b:v 2500k -maxrate 2500k -bufsize 5000k -pix_fmt yuv420p -g 60 \
          -c:a aac -b:a 128k -ar 44100 \
          -f flv "rtmp://a.rtmp.youtube.com/live2/$YOUTUBE_STREAM_KEY"
